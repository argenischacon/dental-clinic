<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin_layout}">
<head>
    <title>Agregar Servicio</title>
</head>
<body>

    <!-- ==================== MAIN CONTENT ==================== -->
    <div layout:fragment="content">
        <!--/*@thymesVar id="serviceRequestDto" type="com.argenischacon.dentalclinic.dto.service.ServiceRequestDto"*/-->

        <!-- Page Heading -->
        <div class="d-sm-flex align-items-center justify-content-between mb-4">
            <div>
                <h1 class="h3 mb-1 text-gray-800">Agregar Servicio</h1>
                <p class="mb-0 text-gray-600 small">Complete la información para registrar un nuevo servicio en la clínica.</p>
            </div>
            <a th:href="@{/admin/services/list}" class="d-none d-sm-inline-block btn btn-sm btn-secondary shadow-sm">
                <i class="fas fa-arrow-left fa-sm text-white-50 mr-1"></i> Volver a la lista
            </a>
        </div>

        <!-- Form -->
        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">Detalles del Nuevo Servicio</h6>
            </div>
            
            <div class="card-body px-4 py-5">
            
                <!-- Global alerts (server errors or success) -->
                <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
                <div th:if="${success}" class="alert alert-success" role="alert" th:text="${success}"></div>

                <!-- Creation Form -->
                <form th:action="@{/admin/services/save}" th:object="${serviceRequestDto}" method="post">
                    
                    <!-- ********** SECTION 01: BASIC DATA ********** -->
                    <div class="d-flex align-items-center mb-4">
                        <span class="badge badge-primary rounded-circle p-2 d-flex align-items-center justify-content-center mr-2" style="width: 32px; height: 32px;">01</span>
                        <h5 class="font-weight-bold text-gray-800 m-0">Datos Generales</h5>
                    </div>
                    
                    <div class="form-row">
                        <!-- Service Code -->
                        <div class="form-group col-md-4 mb-4">
                            <label class="text-xs font-weight-bold text-gray-600 text-uppercase mb-1" for="serviceCodeInput">Código de Servicio</label>
                            <input type="text" class="form-control bg-light border-0" id="serviceCodeInput" th:field="*{serviceCode}" placeholder="Ej: LIM-001" required maxlength="10">
                            <!-- // Errores de validación (opcional si se usa validación Spring MVC) -->
                            <small class="form-text text-danger" th:if="${#fields.hasErrors('serviceCode')}" th:errors="*{serviceCode}"></small>
                        </div>
                        
                        <!-- Name -->
                        <div class="form-group col-md-8 mb-4">
                            <label class="text-xs font-weight-bold text-gray-600 text-uppercase mb-1" for="nameInput">Nombre del Servicio</label>
                            <input type="text" class="form-control bg-light border-0" id="nameInput" th:field="*{name}" placeholder="Ej: Limpieza Dental Profunda" required maxlength="100">
                            <small class="form-text text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <!-- Description -->
                        <div class="form-group col-12 mb-4">
                            <label class="text-xs font-weight-bold text-gray-600 text-uppercase mb-1" for="descriptionInput">Descripción</label>
                            <textarea class="form-control bg-light border-0" id="descriptionInput" th:field="*{description}" rows="3" placeholder="Descripción detallada del servicio..." maxlength="500"></textarea>
                            <small class="form-text text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></small>
                        </div>
                    </div>
                    
                    <!-- ********** SECTION 02: CONFIGURATION ********** -->
                    <div class="d-flex align-items-center mb-4 mt-2">
                        <span class="badge badge-primary rounded-circle p-2 d-flex align-items-center justify-content-center mr-2" style="width: 32px; height: 32px;">02</span>
                        <h5 class="font-weight-bold text-gray-800 m-0">Configuración</h5>
                    </div>
                    
                    <div class="form-row">
                        <!-- Price -->
                        <div class="form-group col-md-4 mb-4">
                            <label class="text-xs font-weight-bold text-gray-600 text-uppercase mb-1" for="priceInput">Precio ($)</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text bg-light border-0"><i class="fas fa-dollar-sign text-gray-500"></i></span>
                                </div>
                                <input type="number" step="0.01" min="0.01" class="form-control bg-light border-0" id="priceInput" th:field="*{price}" placeholder="0.00" required>
                            </div>
                            <small class="form-text text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></small>
                        </div>
                        
                        <!-- Duration -->
                        <div class="form-group col-md-4 mb-4">
                            <label class="text-xs font-weight-bold text-gray-600 text-uppercase mb-1" for="durationInput">Duración (Minutos)</label>
                            <div class="input-group">
                                <input type="number" min="15" class="form-control bg-light border-0" id="durationInput" th:field="*{durationMinutes}" placeholder="Ej: 30" required>
                                <div class="input-group-append">
                                    <span class="input-group-text bg-light border-0">min</span>
                                </div>
                            </div>
                            <small class="form-text text-danger" th:if="${#fields.hasErrors('durationMinutes')}" th:errors="*{durationMinutes}"></small>
                        </div>
                    </div>
                    
                    <!-- Divider and Action Buttons -->
                    <hr class="mt-4 mb-4">
                    
                    <div class="d-flex justify-content-end align-items-center">
                        <a th:href="@{/admin/services/list}" class="btn btn-link text-gray-600 font-weight-bold mr-3 text-decoration-none">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary px-4 py-2 font-weight-bold shadow-sm">
                            <i class="fas fa-save mr-2"></i>Guardar Servicio
                        </button>
                    </div>
                    
                </form>
            </div>
        </div>

    </div>
    <!-- ==================== END MAIN CONTENT ==================== -->

</body>
</html>
