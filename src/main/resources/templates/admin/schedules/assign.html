<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin_layout}">
<head>
    <title>Práctica de horario</title>
</head>
<body>
<div layout:fragment="content">
    <!-- Breadcrumb Navigation -->
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb bg-transparent p-0 mb-2">
            <li class="breadcrumb-item"><a href="#">Horarios</a></li>
            <li class="breadcrumb-item active" aria-current="page">Asignar Horario</li>
        </ol>
    </nav>

    <!-- Page Title and Description -->
    <h1 class="h3 mb-1 text-gray-800">Horario de trabajo</h1>
    <p class="mb-4 text-muted">
        Gestiona el horario del profesional.
    </p>

    <!--Schedule Form-->
    <form th:action="@{/admin/schedules/assign}" th:object="${scheduleForm}" method="post" id="scheduleForm">
        <div id="form-content-container">
            <div id="form-content">

                <!-- Block: General Data Card (Dentist selection and slot duration) -->
                <div class="card shadow mb-4 border-left-primary">
                    <div class="card-header py-3 d-flex align-items-center">
                        <i class="fas fa-info-circle text-primary mr-2"></i>
                        <h6 class="m-0 font-weight-bold text-primary">Datos generales</h6>
                    </div>

                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="font-weight-bold text-gray-800 small" for="dentistId">
                                    Odontólogo
                                    <div id="form-loader"
                                         class="spinner-border spinner-border-sm text-primary ml-2 htmx-indicator"
                                         role="status">
                                        <span class="sr-only">Cargando...</span>
                                    </div>
                                </label>
                                <select th:field="*{dentistId}" name="dentistId" id="dentistId" class="custom-select" required
                                        hx-get="/admin/schedules/tabs" hx-target="#schedule-settings-container" hx-indicator="#form-loader"
                                        hx-trigger="change" hx-include="#scheduleForm">
                                    <option value="">Seleccione un odontólogo...</option>
                                    <option th:each="dentist : ${dentists}"
                                            th:value="${dentist.id}"
                                            th:text="${dentist.fullName}">Odontólogo</option>
                                </select>
                            </div>

                            <div id="schedule-settings-container" style="display: contents;">
                                <th:block th:replace="~{admin/schedules/_schedule_tabs :: tabs}"></th:block>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<!-- Block: Add Break Modal -->
<div class="modal fade" id="addBreakModal" tabindex="-1" role="dialog" aria-labelledby="addBreakModalLabel"
     aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title font-weight-bold" id="addBreakModalLabel">
                    <i class="fas fa-coffee mr-2 text-warning"></i>Agregar descanso
                </h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body text-center py-5">
                <i class="fas fa-tools fa-3x text-gray-300 mb-3"></i>
                <p class="text-muted mb-0">La funcionalidad para agregar descansos estará disponible
                    próximamente.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

<!-- Block: Template-specific Scripts -->
<div layout:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script th:if="${success}">
        Swal.fire({
          position: "top-end",
          icon: "success",
          title: "[[${success}]]",
          showConfirmButton: false,
          timer: 2000
        });
    </script>
    
    <script th:if="${error}">
        Swal.fire({
          position: "top-end",
          icon: "error",
          title: "Error",
          text: "[[${error}]]",
          showConfirmButton: true
        });
    </script>
</div>

</body>

</html>
