<th:block th:fragment="preview">
    <div class="card-footer bg-light p-4">
        <!-- Error Alert -->
        <div th:if="${previewError}" class="alert alert-danger d-flex align-items-center py-2 px-3 mb-0 small" role="alert">
            <i class="fas fa-exclamation-triangle mr-3 fa-lg"></i>
            <div th:text="${previewError}">Error</div>
        </div>

        <!-- Success Preview -->
        <div th:unless="${previewError}">
            <h6 class="font-weight-bold text-success mb-3"><i class="fas fa-eye mr-2"></i> Vista Previa del Día</h6>
            
            <div class="d-flex flex-wrap mb-3">
                <!-- Iterate breaks -->
                <div th:each="brk : ${breaks}" class="badge badge-warning text-dark p-2 m-1 border shadow-sm">
                    <i class="fas fa-mug-hot mr-1"></i> <span th:text="${brk.label}">Descanso</span>
                    (<span th:text="|${brk.startBreak} - ${brk.endBreak}|"></span>)
                </div>
            </div>

            <div class="d-flex flex-wrap">
                <!-- Iterate slots -->
                <div th:each="slot : ${slots}" class="badge badge-success p-2 m-1 border shadow-sm" style="font-size: 0.9em;">
                    <i class="far fa-clock mr-1"></i> <span th:text="|${slot.start} - ${slot.end}|"></span>
                </div>
                
                <div th:if="${#lists.isEmpty(slots)}" class="text-muted small w-100 mt-2">
                    <i class="fas fa-info-circle mr-1"></i> No se pudieron generar bloques de atención. Verifique las horas y descansos configurados.
                </div>
            </div>
        </div>
    </div>
</th:block>
